name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%239C5A2B&color_dots=%23EFE4D2,%23E3D2B8,%23C9A67C,%238B6248,%234B2E1E
            dist/snake-dark.svg?color_snake=%23D9A066&color_dots=%2321160F,%233A281D,%238B6248,%23C9A67C,%23F6EFE3

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
